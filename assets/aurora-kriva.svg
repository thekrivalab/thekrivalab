<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title description">
  <title id="title">Kriva Lab — Aurora</title>
  <desc id="description">Faixas orgânicas de luz violeta, rosa e âmbar atravessam um céu escuro acima do nome Kriva Lab.</desc>
  <defs>
    <radialGradient id="sky" cx="0.5" cy="1" r="1.1"><stop offset="0" stop-color="#17103a"/><stop offset="0.55" stop-color="#0a0920"/><stop offset="1" stop-color="#03030a"/></radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset="0.2" stop-color="#a78bfa" stop-opacity=".55"/><stop offset=".55" stop-color="#d8b4fe" stop-opacity=".85"/><stop offset=".85" stop-color="#a78bfa" stop-opacity=".5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185" stop-opacity="0"/><stop offset=".3" stop-color="#fb7185" stop-opacity=".45"/><stop offset=".6" stop-color="#f0abfc" stop-opacity=".75"/><stop offset=".85" stop-color="#fb7185" stop-opacity=".4"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24" stop-opacity="0"/><stop offset=".5" stop-color="#fde68a" stop-opacity=".55"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070713"/><stop offset="1" stop-color="#000001"/></linearGradient>
    <filter id="flow-1" x="-30%" y="-50%" width="160%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".006 .022" numOctaves="3" seed="2" result="noise"><animate attributeName="baseFrequency" values=".006 .022;.011 .028;.006 .022" dur="24s" repeatCount="indefinite"/><animate attributeName="seed" from="0" to="40" dur="40s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="90" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="flow-2" x="-30%" y="-50%" width="160%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".009 .026" numOctaves="2" seed="9" result="noise"><animate attributeName="baseFrequency" values=".009 .026;.014 .034;.009 .026" dur="18s" repeatCount="indefinite"/><animate attributeName="seed" from="0" to="30" dur="32s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="70"/></filter>
    <filter id="flow-3" x="-30%" y="-50%" width="160%" height="200%"><feTurbulence type="fractalNoise" baseFrequency=".013 .04" numOctaves="2" seed="17" result="noise"><animate attributeName="seed" from="0" to="50" dur="22s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="48"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .95 0 0 0 0 .95 0 0 0 0 .95 0 0 0 .06 0"/></filter>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" filter="url(#grain)" opacity=".4"/>
  <g fill="#fff" opacity=".85"><circle cx="80" cy="42" r=".8"><animate attributeName="opacity" values=".2;.95;.2" dur="3.4s" repeatCount="indefinite"/></circle><circle cx="240" cy="34" r=".7"><animate attributeName="opacity" values=".3;1;.3" dur="4.1s" repeatCount="indefinite"/></circle><circle cx="402" cy="58" r="1.3"><animate attributeName="opacity" values=".4;1;.4" dur="5s" repeatCount="indefinite"/></circle><circle cx="642" cy="48" r=".7"><animate attributeName="opacity" values=".6;.15;.6" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="884" cy="74" r=".8"><animate attributeName="opacity" values=".7;.3;.7" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="1042" cy="92" r=".7"><animate attributeName="opacity" values=".5;1;.5" dur="3.3s" repeatCount="indefinite"/></circle><circle cx="1170" cy="22" r=".8"><animate attributeName="opacity" values=".3;.85;.3" dur="4.2s" repeatCount="indefinite"/></circle></g>
  <g filter="url(#flow-1)" opacity=".55"><rect x="-100" y="120" width="1400" height="120" fill="url(#amber)"/></g>
  <g filter="url(#flow-2)" opacity=".85"><rect x="-100" y="80" width="1400" height="160" fill="url(#rose)"/></g>
  <g filter="url(#flow-3)" opacity=".92"><rect x="-100" y="60" width="1400" height="180" fill="url(#violet)"/></g>
  <g opacity=".18" filter="url(#flow-2)" transform="translate(0,420) scale(1,-.35)"><rect x="-100" y="80" width="1400" height="160" fill="url(#rose)"/></g>
  <path d="M0 420V300l80-28 70 16 60-38 70 30 60-42 80 34 70-22 90 40 60-30 80 35 80-37 80 30 70-22 80 36 70-24 70 16 30-14v140Z" fill="url(#mountain)"/>
  <path d="m0 300 80-28 70 16 60-38 70 30 60-42 80 34 70-22 90 40 60-30 80 35 80-37 80 30 70-22 80 36 70-24 70 16 30-14" fill="none" stroke="#d8b4fe" stroke-width=".6" opacity=".5"/>
  <g font-family="Georgia, serif"><text x="80" y="368" font-size="74" font-weight="500" font-style="italic" fill="#fff7ed" filter="url(#glow)" letter-spacing="-1.5">Kriva Lab</text></g>
  <g font-family="ui-monospace, monospace"><text x="82" y="396" font-size="11" fill="#d8b4fe" letter-spacing="4.5" opacity=".95">∗ DESIGN · TECNOLOGIA · INTENÇÃO ∗</text></g>
  <text x="1120" y="396" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#cbd5e1" opacity=".55">SÃO PAULO · BRASIL</text>
  <g transform="translate(80 40)" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" letter-spacing="3"><path d="M0 0h14" stroke="#94a3b8" stroke-width=".6"/><text x="20" y="3">KRIVA LAB · EST. 2026</text></g>
  <g transform="translate(1120 40)" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" letter-spacing="3" text-anchor="end"><text x="-20" y="3">SINAL CRIATIVO</text><path d="M-14 0H0" stroke="#94a3b8" stroke-width=".6"/></g>
</svg>
